# API PontoWebDesk — api.phmsdev.com.br
#
# Instalação na VPS:
#   sudo cp deploy/nginx/api.phmsdev.com.br.conf /etc/nginx/sites-available/api.phmsdev.com.br
#   sudo ln -sf /etc/nginx/sites-available/api.phmsdev.com.br /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default   # se o default conflitar
#   sudo nginx -t && sudo systemctl reload nginx
#
# REGRA: proxy_pass DEVE terminar em /api/ — NUNCA http://127.0.0.1:3000/
#   Certo:  proxy_pass http://127.0.0.1:3000/api/;
#   Errado: proxy_pass http://127.0.0.1:3000/;   ← remove /api → Cannot POST /auth/login
#
# CORS: apenas no Express (backend/src/app.ts + corsConfig.ts).
# Não adicionar Access-Control-* no Nginx — duplica o header e o browser bloqueia.

server {
    listen 80;
    listen [::]:80;
    server_name api.phmsdev.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl http2;
    server_name api.phmsdev.com.br;

    ssl_certificate /etc/letsencrypt/live/api.phmsdev.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.phmsdev.com.br/privkey.pem;

    location /api/ {
        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
    }

    location / {
        return 404;
    }
}
