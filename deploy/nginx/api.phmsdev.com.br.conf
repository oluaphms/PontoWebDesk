# API PontoWebDesk — api.phmsdev.com.br
#
# Instalação na VPS:
#   sudo cp deploy/nginx/api.phmsdev.com.br.conf /etc/nginx/sites-available/api.phmsdev.com.br
#   sudo ln -sf /etc/nginx/sites-available/api.phmsdev.com.br /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default   # se o default conflitar
#   sudo nginx -t && sudo systemctl reload nginx
#
# REGRA: proxy_pass DEVE terminar em /api/ — NUNCA http://127.0.0.1:3000/
#   Certo:  proxy_pass http://127.0.0.1:3000/api/;
#   Errado: proxy_pass http://127.0.0.1:3000/;   ← remove /api → Cannot POST /auth/login

server {
    listen 80;
    listen [::]:80;
    server_name api.phmsdev.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl http2;
    server_name api.phmsdev.com.br;

    ssl_certificate /etc/letsencrypt/live/api.phmsdev.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.phmsdev.com.br/privkey.pem;

    location /api/ {
        # CORS no Nginx — preflight 204 sem headers bloqueava login na Vercel
        set $cors_allow "";
        if ($http_origin ~* ^https://pontowebdesk(-[a-z0-9-]+)?\.vercel\.app$) {
            set $cors_allow $http_origin;
        }
        if ($http_origin = "http://localhost:3010") {
            set $cors_allow $http_origin;
        }
        if ($http_origin = "http://localhost:5173") {
            set $cors_allow $http_origin;
        }

        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_allow;
            add_header Access-Control-Allow-Credentials true;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS";
            add_header Access-Control-Allow-Headers "Authorization, Content-Type";
            add_header Access-Control-Max-Age 86400;
            add_header Content-Length 0;
            return 204;
        }

        add_header Access-Control-Allow-Origin $cors_allow always;
        add_header Access-Control-Allow-Credentials true always;

        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
    }

    location / {
        return 404;
    }
}
