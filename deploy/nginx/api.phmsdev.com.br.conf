# API PontoWebDesk — api.phmsdev.com.br
#
# Instalação na VPS:
#   sudo cp deploy/nginx/api.phmsdev.com.br.conf /etc/nginx/sites-available/api.phmsdev.com.br
#   sudo ln -sf /etc/nginx/sites-available/api.phmsdev.com.br /etc/nginx/sites-enabled/
#   sudo rm -f /etc/nginx/sites-enabled/default   # se o default conflitar
#   sudo nginx -t && sudo systemctl reload nginx
#
# REGRA: proxy_pass DEVE terminar em /api/ — NUNCA http://127.0.0.1:3000/
#   Certo:  proxy_pass http://127.0.0.1:3000/api/;
#   Errado: proxy_pass http://127.0.0.1:3000/;   ← remove /api → Cannot POST /auth/login

# Origens do frontend (Vercel + dev) — ecoadas em respostas normais e em 502/504
map $http_origin $cors_allow_origin {
    default "";
    "~^https://pontowebdesk(-[a-z0-9-]+)?\.vercel\.app$" $http_origin;
    "https://pontowebdesk.vercel.app" $http_origin;
    "http://localhost:3010" $http_origin;
    "http://localhost:5173" $http_origin;
    "http://127.0.0.1:3010" $http_origin;
    "http://127.0.0.1:5173" $http_origin;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.phmsdev.com.br;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl http2;
    server_name api.phmsdev.com.br;

    ssl_certificate /etc/letsencrypt/live/api.phmsdev.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.phmsdev.com.br/privkey.pem;

    # CORS em todas as respostas (incl. 502 quando Node estiver parado)
    add_header Access-Control-Allow-Origin $cors_allow_origin always;
    add_header Access-Control-Allow-Credentials true always;
    add_header Vary Origin always;

    location /api/ {
        if ($request_method = OPTIONS) {
            add_header Access-Control-Allow-Origin $cors_allow_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Length 0;
            return 204;
        }

        proxy_pass http://127.0.0.1:3000/api/;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_bypass $http_upgrade;
    }

    location / {
        return 404;
    }
}
